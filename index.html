<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマート家計簿 - Firebase Dashboard</title>

    <!-- Favicon (Data URI) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js (with crossorigin attribute to mitigate tracking prevention warnings) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md">
                    <!-- Wallet SVG -->
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-emerald-600 to-teal-700 bg-clip-text text-transparent">
                    スマート家計簿
                </span>
            </div>

            <!-- User Auth Status / Button -->
            <div id="authStatusContainer" class="flex items-center space-x-3">
                <!-- Skeleton loader -->
                <div id="authLoading" class="animate-pulse flex items-center space-x-2">
                    <div class="w-8 h-8 bg-slate-200 rounded-full"></div>
                    <div class="h-4 w-20 bg-slate-200 rounded"></div>
                </div>

                <!-- User Profile (Hidden by default) -->
                <div id="userProfile" class="hidden flex items-center space-x-3">
                    <img id="userAvatar" src="" alt="Avatar" class="w-9 h-9 rounded-full border-2 border-emerald-500 shadow-sm">
                    <span id="userName" class="text-sm font-medium text-slate-700 hidden sm:inline-block"></span>
                    <button id="logoutBtn" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2 rounded-lg font-medium transition duration-150 flex items-center space-x-1.5">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        <span>ログアウト</span>
                    </button>
                </div>

                <!-- Login Button (Hidden by default) -->
                <button id="loginBtn" class="hidden bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-medium transition duration-150 flex items-center space-x-2 shadow-sm">
                    <svg class="w-4 h-4 fill-current text-emerald-400" viewBox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
                    <span>Googleでログイン</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Unauthenticated View Banner -->
        <div id="unauthView" class="hidden py-16 flex flex-col items-center justify-center text-center">
            <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-600 mb-6 shadow-inner">
                <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2 0v8.99h9c-.53-4.76-4.24-8.47-9-8.99zm0 11.01V22c4.76-.52 8.47-4.23 9-8.99h-9z"/></svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 mb-3">収支をスマートに管理・分析</h1>
            <p class="text-slate-500 max-w-md mb-8">
                Googleアカウントでサインインして、クラウド上で簡単・安心に家計簿を記録しましょう。リアルタイムで収支の見える化が可能です。
            </p>
            <button id="mainLoginBtn" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-medium px-8 py-3.5 rounded-xl shadow-lg hover:shadow-emerald-500/25 transition duration-200 flex items-center space-x-3 text-lg">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
                <span>今すぐGoogleでログイン</span>
            </button>
        </div>

        <!-- Authenticated App View -->
        <div id="appView" class="hidden space-y-6">

            <!-- Month Selector & Actions Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                <div class="flex items-center space-x-3">
                    <button id="prevMonthBtn" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                    </button>
                    <span id="currentMonthDisplay" class="text-xl font-bold text-slate-800 min-w-[120px] text-center">
                        ----年--月
                    </span>
                    <button id="nextMonthBtn" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                    </button>
                    <button id="todayBtn" class="text-xs bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-medium px-2.5 py-1.5 rounded-lg transition">
                        今月
                    </button>
                </div>

                <div class="flex items-center space-x-3">
                    <button id="openModalBtn" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                        <span>収支を追加</span>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <!-- Total Income Card -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">今月の収入</p>
                        <h3 id="totalIncome" class="text-2xl font-bold text-slate-800">¥0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/></svg>
                    </div>
                </div>

                <!-- Total Expense Card -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">今月の支出</p>
                        <h3 id="totalExpense" class="text-2xl font-bold text-rose-600">¥0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
                    </div>
                </div>

                <!-- Balance Card -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">収支差額</p>
                        <h3 id="netBalance" class="text-2xl font-bold text-slate-800">¥0</h3>
                    </div>
                    <div id="balanceIconContainer" class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Expense Doughnut Chart -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm lg:col-span-1 flex flex-col">
                    <h4 class="font-bold text-slate-700 mb-4 flex items-center space-x-2">
                        <svg class="w-5 h-5 fill-current text-emerald-500" viewBox="0 0 24 24"><path d="M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2 0v8.99h9c-.53-4.76-4.24-8.47-9-8.99zm0 11.01V22c4.76-.52 8.47-4.23 9-8.99h-9z"/></svg>
                        <span>支出内訳</span>
                    </h4>
                    <div class="relative flex-grow flex items-center justify-center min-h-[220px]">
                        <canvas id="expenseChart"></canvas>
                        <div id="noChartData" class="hidden absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-sm">
                            <svg class="w-10 h-10 fill-current text-slate-300 mb-2" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                            <span>データがありません</span>
                        </div>
                    </div>
                </div>

                <!-- Category Expense Breakdown List -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm lg:col-span-2 flex flex-col">
                    <h4 class="font-bold text-slate-700 mb-4 flex items-center space-x-2">
                        <svg class="w-5 h-5 fill-current text-emerald-500" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                        <span>カテゴリ別集計</span>
                    </h4>
                    <div id="categoryBreakdown" class="space-y-3 overflow-y-auto max-h-[240px] pr-1">
                        <!-- Filled dynamically -->
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <h4 class="font-bold text-slate-800 flex items-center space-x-2">
                        <svg class="w-5 h-5 fill-current text-emerald-500" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                        <span>収支明細一覧</span>
                    </h4>
                    <div class="flex items-center space-x-2">
                        <select id="filterType" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="all">すべて表示</option>
                            <option value="expense">支出のみ</option>
                            <option value="income">収入のみ</option>
                        </select>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-50/70 text-slate-400 text-xs uppercase font-semibold border-b border-slate-100">
                                <th class="py-3 px-4">日付</th>
                                <th class="py-3 px-4">区分</th>
                                <th class="py-3 px-4">カテゴリ</th>
                                <th class="py-3 px-4">メモ</th>
                                <th class="py-3 px-4 text-right">金額</th>
                                <th class="py-3 px-4 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="transactionList" class="divide-y divide-slate-100">
                            <!-- Filled dynamically -->
                        </tbody>
                    </table>
                </div>

                <div id="noTransactions" class="hidden p-8 text-center text-slate-400">
                    <svg class="w-12 h-12 fill-current text-slate-300 mx-auto mb-2" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                    <p>この月のデータはありません</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal for Adding / Editing Transaction -->
    <div id="transactionModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl max-w-md w-full mx-4 shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200" id="modalContainer">
            <div class="p-5 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-slate-800 text-lg">収支の登録</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-200 transition">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>

            <form id="transactionForm" class="p-5 space-y-4">
                <input type="hidden" id="editDocId" value="">

                <!-- Type Selector (Tab Style) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">収支タイプ</label>
                    <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                        <button type="button" id="typeExpenseBtn" class="py-2 text-sm font-medium rounded-lg transition text-slate-700 bg-white shadow-sm">
                            支出
                        </button>
                        <button type="button" id="typeIncomeBtn" class="py-2 text-sm font-medium rounded-lg transition text-slate-500 hover:text-slate-700">
                            収入
                        </button>
                    </div>
                    <input type="hidden" id="transactionType" value="expense">
                </div>

                <!-- Date Input -->
                <div>
                    <label for="transactionDate" class="block text-xs font-semibold text-slate-500 mb-1">日付</label>
                    <input type="date" id="transactionDate" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800">
                </div>

                <!-- Category Input -->
                <div>
                    <label for="transactionCategory" class="block text-xs font-semibold text-slate-500 mb-1">カテゴリ</label>
                    <select id="transactionCategory" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800">
                        <!-- Options populated via JavaScript based on type -->
                    </select>
                </div>

                <!-- Amount Input -->
                <div>
                    <label for="transactionAmount" class="block text-xs font-semibold text-slate-500 mb-1">金額 (円)</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-medium">¥</span>
                        <input type="number" id="transactionAmount" min="1" required placeholder="0" class="w-full pl-8 pr-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800 font-bold text-lg">
                    </div>
                </div>

                <!-- Memo Input -->
                <div>
                    <label for="transactionMemo" class="block text-xs font-semibold text-slate-500 mb-1">メモ (任意)</label>
                    <input type="text" id="transactionMemo" placeholder="例: スーパーで買い物" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800">
                </div>

                <!-- Form Action Buttons -->
                <div class="pt-3 flex space-x-3">
                    <button type="button" id="cancelModalBtn" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-medium transition">
                        キャンセル
                    </button>
                    <button type="submit" id="saveTransactionBtn" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium shadow-md transition flex items-center justify-center space-x-2">
                        <span>保存する</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl max-w-sm w-full mx-4 p-5 shadow-2xl space-y-4">
            <div class="text-center">
                <div class="w-12 h-12 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-3">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </div>
                <h3 class="font-bold text-slate-800 text-lg">明細の削除</h3>
                <p class="text-sm text-slate-500 mt-1">この明細を削除してもよろしいですか？この操作は取り消せません。</p>
            </div>
            <div class="flex space-x-3 pt-2">
                <button id="cancelDeleteBtn" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-medium transition text-sm">
                    キャンセル
                </button>
                <button id="confirmDeleteBtn" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-medium shadow-md transition text-sm">
                    削除する
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <svg id="toastIcon" class="w-5 h-5 fill-current text-emerald-400" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        <span id="toastMessage" class="text-sm font-medium">メッセージ</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signInWithRedirect,
            getRedirectResult,
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // App States

        const todayBtn = document.getElementById('todayBtn');

        const totalIncomeEl = document.getElementById('totalIncome');
        const totalExpenseEl = document.getElementById('totalExpense');

        // Modal Elements
        const transactionModal = document.getElementById('transactionModal');

        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        const transactionForm = document.getElementById('transactionForm');
        
        const typeExpenseBtn = document.getElementById('typeExpenseBtn');
        const typeIncomeBtn = document.getElementById('typeIncomeBtn');

        const editDocIdInput = document.getElementById('editDocId');
        const transactionDateInput = document.getElementById('transactionDate');

        const transactionAmountInput = document.getElementById('transactionAmount');
        const transactionMemoInput = document.getElementById('transactionMemo');

        // Handle Google Login with fallback to Redirect if Popup is blocked (COOP mitigation)
        const handleGoogleLogin = async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                showToast('ログインしました');
            } catch (error) {
                console.warn("Popup Login failed, attempting redirect login:", error);
                if (error.code === 'auth/popup-blocked' || error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
                    try {
                        await signInWithRedirect(auth, googleProvider);
                    } catch (redirectErr) {
                        console.error("Redirect Login Error:", redirectErr);
                        showToast('ログインに失敗しました', true);
                    }
                } else {
                    showToast('ログインに失敗しました', true);
                }
            }
        };

        // Check redirect result on load
        getRedirectResult(auth).catch((error) => {
            if (error && error.code) {
                console.error("Redirect Auth Error:", error);
            }
        });

        loginBtn.addEventListener('click', handleGoogleLogin);
        mainLoginBtn.addEventListener('click', handleGoogleLogin);

        // Auth State Observer
        onAuthStateChanged(auth, (user) => {

                if (unsubscribeSnapshot) {

        function updateMonthDisplay() {
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0');
            currentMonthDisplay.textContent = `${year}年${month}月`;
        }

        prevMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateMonthDisplay();
            renderDashboard();
        });

        nextMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateMonthDisplay();
            renderDashboard();
        });

        todayBtn.addEventListener('click', () => {
            currentDate = new Date();
            updateMonthDisplay();
            renderDashboard();
        });

        function listenToTransactions() {
            if (!currentUser) return;

            const transactionsRef = collection(db, 'users', currentUser.uid, 'transactions');
            const q = query(transactionsRef, orderBy('date', 'desc'));

            if (unsubscribeSnapshot) unsubscribeSnapshot();

            unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                allTransactions = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                renderDashboard();
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                showToast('データの読み込みに失敗しました', true);
            });
        }

        function renderDashboard() {
            const targetYear = currentDate.getFullYear();
            const targetMonth = currentDate.getMonth();

            const monthlyTransactions = allTransactions.filter(t => {
                if (!t.date) return false;
                const d = new Date(t.date);
                return d.getFullYear() === targetYear && d.getMonth() === targetMonth;
            });

            let income = 0;
            let expense = 0;

            monthlyTransactions.forEach(t => {
                const amt = Number(t.amount) || 0;
                if (t.type === 'income') income += amt;
                if (t.type === 'expense') expense += amt;
            });

            const net = income - expense;

            totalIncomeEl.textContent = `¥${income.toLocaleString()}`;
            totalExpenseEl.textContent = `¥${expense.toLocaleString()}`;
            netBalanceEl.textContent = `¥${net.toLocaleString()}`;

            if (net < 0) {
                netBalanceEl.className = 'text-2xl font-bold text-rose-600';
            } else {
                netBalanceEl.className = 'text-2xl font-bold text-slate-800';
            }

            renderExpenseChart(monthlyTransactions);
            renderCategoryBreakdown(monthlyTransactions, expense);
            renderTransactionList(monthlyTransactions);
        }

        function renderExpenseChart(transactions) {
            const canvas = document.getElementById('expenseChart');
            const noDataEl = document.getElementById('noChartData');
            const expenses = transactions.filter(t => t.type === 'expense');

            if (expenses.length === 0) {
                canvas.classList.add('hidden');
                noDataEl.classList.remove('hidden');
                if (expenseChart) expenseChart.destroy();
                return;
            }

            canvas.classList.remove('hidden');
            noDataEl.classList.add('hidden');

            const categoryTotals = {};
            expenses.forEach(t => {
                categoryTotals[t.category] = (categoryTotals[t.category] || 0) + Number(t.amount);
            });

            const labels = Object.keys(categoryTotals);
            const data = Object.values(categoryTotals);
            const backgroundColors = labels.map(label => {
                const cat = CATEGORIES.expense.find(c => c.name === label);
                return cat ? cat.color : '#cbd5e1';
            });

            if (expenseChart) {
                expenseChart.destroy();
            }

            const ctx = canvas.getContext('2d');
            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: backgroundColors,
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.raw || 0;
                                    return ` ${context.label}: ¥${value.toLocaleString()}`;
                                }
                            }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        function renderCategoryBreakdown(transactions, totalExpense) {
            const container = document.getElementById('categoryBreakdown');
            const expenses = transactions.filter(t => t.type === 'expense');

            if (expenses.length === 0 || totalExpense === 0) {
                container.innerHTML = `<p class="text-slate-400 text-sm text-center py-6">支出データはありません</p>`;
                return;
            }

            const categoryTotals = {};
            expenses.forEach(t => {
                categoryTotals[t.category] = (categoryTotals[t.category] || 0) + Number(t.amount);
            });

            const sortedCategories = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1]);

            container.innerHTML = sortedCategories.map(([catName, amount]) => {
                const percent = Math.round((amount / totalExpense) * 100);
                const catInfo = CATEGORIES.expense.find(c => c.name === catName) || { color: '#64748b', svg: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>' };

                return `
                    <div class="space-y-1">
                        <div class="flex justify-between items-center text-sm">
                            <span class="flex items-center space-x-2 text-slate-700 font-medium">
                                <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${catInfo.color}"></span>
                                <svg class="w-4 h-4 fill-current text-slate-400" viewBox="0 0 24 24">${catInfo.svg}</svg>
                                <span>${catName}</span>
                            </span>
                            <span class="font-bold text-slate-800">¥${amount.toLocaleString()} <span class="text-xs text-slate-400 font-normal">(${percent}%)</span></span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                            <div class="h-2 rounded-full transition-all duration-500" style="width: ${percent}%; background-color: ${catInfo.color}"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderTransactionList(transactions) {
            const filterValue = filterTypeSelect.value;
            let filtered = transactions;

            if (filterValue !== 'all') {
                filtered = transactions.filter(t => t.type === filterValue);
            }

            if (filtered.length === 0) {
                transactionListEl.innerHTML = '';
                noTransactionsEl.classList.remove('hidden');
                return;
            }

            noTransactionsEl.classList.add('hidden');

            transactionListEl.innerHTML = filtered.map(t => {
                const isIncome = t.type === 'income';
                const catGroup = isIncome ? CATEGORIES.income : CATEGORIES.expense;
                const catInfo = catGroup.find(c => c.name === t.category) || { color: '#64748b', svg: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>' };
                const amountFormatted = `${isIncome ? '+' : '-'}¥${Number(t.amount).toLocaleString()}`;
                const amountColorClass = isIncome ? 'text-emerald-600 font-bold' : 'text-slate-800 font-bold';

                return `
                    <tr class="hover:bg-slate-50/80 transition duration-150">
                        <td class="py-3.5 px-4 text-slate-600 font-medium text-xs sm:text-sm whitespace-nowrap">
                            ${t.date}

                        <td class="py-3.5 px-4 whitespace-nowrap">

                                </span>
                                <span class="text-slate-700 font-medium">${t.category}</span>

                            </button>
                            <button onclick="window.deleteTransaction('${t.id}')" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition" title="削除">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        filterTypeSelect.addEventListener('change', renderDashboard);

        function populateCategories(type) {
            transactionCategorySelect.innerHTML = '';
            CATEGORIES[type].forEach(cat => {

                opt.value = cat.name;
                opt.textContent = cat.name;
                transactionCategorySelect.appendChild(opt);

        function setFormType(type) {
            transactionTypeInput.value = type;
            if (type === 'expense') {
                typeExpenseBtn.className = "py-2 text-sm font-medium rounded-lg transition text-slate-700 bg-white shadow-sm";
                typeIncomeBtn.className = "py-2 text-sm font-medium rounded-lg transition text-slate-500 hover:text-slate-700";
            } else {
                typeIncomeBtn.className = "py-2 text-sm font-medium rounded-lg transition text-slate-700 bg-white shadow-sm";
                typeExpenseBtn.className = "py-2 text-sm font-medium rounded-lg transition text-slate-500 hover:text-slate-700";
            }
            populateCategories(type);
        }

        typeExpenseBtn.addEventListener('click', () => setFormType('expense'));
        typeIncomeBtn.addEventListener('click', () => setFormType('income'));

        function openModal(editData = null) {
            transactionForm.reset();
            if (editData) {
                modalTitle.textContent = "収支の編集";
                editDocIdInput.value = editData.id;
                setFormType(editData.type);
                transactionDateInput.value = editData.date;
                transactionCategorySelect.value = editData.category;
                transactionAmountInput.value = editData.amount;
                transactionMemoInput.value = editData.memo || '';
            } else {
                modalTitle.textContent = "収支の登録";
                editDocIdInput.value = "";
                setFormType('expense');
                const today = new Date().toISOString().split('T')[0];
                transactionDateInput.value = today;
            }

            transactionModal.classList.remove('hidden');
            setTimeout(() => {
                transactionModal.classList.remove('opacity-0');
                modalContainer.classList.remove('scale-95');
                modalContainer.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            transactionModal.classList.add('opacity-0');
            modalContainer.classList.remove('scale-100');
            modalContainer.classList.add('scale-95');
            setTimeout(() => {
                transactionModal.classList.add('hidden');
            }, 200);
        }

        openModalBtn.addEventListener('click', () => openModal());
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        // Save Transaction
        transactionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const docId = editDocIdInput.value;
            const payload = {
                type: transactionTypeInput.value,
                date: transactionDateInput.value,
                category: transactionCategorySelect.value,
                amount: Number(transactionAmountInput.value),
                memo: transactionMemoInput.value.trim(),
                updatedAt: serverTimestamp()
            };

            try {
                if (docId) {
                    const docRef = doc(db, 'users', currentUser.uid, 'transactions', docId);
                    await updateDoc(docRef, payload);
                    showToast('更新しました');
                } else {
                    payload.createdAt = serverTimestamp();
                    const colRef = collection(db, 'users', currentUser.uid, 'transactions');
                    await addDoc(colRef, payload);
                    showToast('追加しました');
                }
                closeModal();
            } catch (error) {
                console.error("Save Error:", error);
                showToast('保存に失敗しました', true);
            }
        });

        window.editTransaction = (id) => {
            const item = allTransactions.find(t => t.id === id);
            if (item) openModal(item);
        };

        // Custom Delete Confirmation Modal Logic
        let pendingDeleteId = null;
        const deleteModal = document.getElementById('deleteModal');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

        window.deleteTransaction = (id) => {
            pendingDeleteId = id;
            deleteModal.classList.remove('hidden');
            setTimeout(() => deleteModal.classList.remove('opacity-0'), 10);
        };

        const closeDeleteModal = () => {
            pendingDeleteId = null;
            deleteModal.classList.add('opacity-0');
            setTimeout(() => deleteModal.classList.add('hidden'), 200);
        };

        cancelDeleteBtn.addEventListener('click', closeDeleteModal);

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!currentUser || !pendingDeleteId) return;

            try {
                const docRef = doc(db, 'users', currentUser.uid, 'transactions', pendingDeleteId);
                await deleteDoc(docRef);
                showToast('削除しました');
            } catch (error) {
                console.error("Delete Error:", error);
                showToast('削除に失敗しました', true);
            } finally {
                closeDeleteModal();
            }
        });

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;
            if (isError) {
                toastIcon.className = "w-5 h-5 fill-current text-rose-400";
                toastIcon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>';
            } else {
                toastIcon.className = "w-5 h-5 fill-current text-emerald-400";
                toastIcon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
